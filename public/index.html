<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FEEEE9" />
<title>Daily Dice · AstroLokal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ==== AstroLokal design tokens (shared with the Bhagya Score surface) ==== */
  :root{
    /* brand palette (2026-08) */
    --bg-top:#FFF8F0; --bg-bot:#FCEEE0;      /* page background */
    --primary:#F45722; --primary-2:#FA9C70; --primary-deep:#D8420F;
    --gold:#FFBF6E;                          /* secondary amber */
    --cta-a:#F45722; --cta-b:#FA9C70;        /* CTA → interactive state */
    --surface:#FFFFFF;
    --cream:#FFF9F1; --cream-2:#FFEBD2;      /* secondary surfaces */
    --brk:#F3C79E;
    --ink:#3A2E28; --ink-2:#9A8B80; --ink-3:#B8A99D;
    --line:#FCE0D2;
    --good:#2E9E5B;
    --pad:16px;
    --radius:24px;
    --shadow:0 10px 30px rgba(196,132,74,.14);
    --shadow-sm:0 4px 14px rgba(196,132,74,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bot) 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  .serif{font-family:'Lora',Georgia,serif}
  .phone{max-width:440px;margin:0 auto;min-height:100%;position:relative;display:flex;flex-direction:column}
  .scroll{flex:1 1 auto;padding:calc(var(--pad) + env(safe-area-inset-top)) var(--pad) 40px;display:flex;flex-direction:column;gap:18px}

  /* ---- card ---- */
  .bx{background:var(--cream);border-radius:var(--radius);box-shadow:var(--shadow)}

  /* ---- header (compact): back arrow left, logo dead-centre ---- */
  .brandbar{position:relative;display:flex;justify-content:center;align-items:center;padding-top:2px;padding-bottom:4px}
  .back-btn{position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:38px;height:38px;border:none;border-radius:50%;cursor:pointer;
    background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);
    display:flex;align-items:center;justify-content:center;transition:transform .12s ease}
  .back-btn:active{transform:translateY(-50%) scale(.94)}
  .back-btn svg{width:20px;height:20px}
  .brand-pill{
    display:inline-flex;align-items:center;gap:7px;
    background:transparent;padding:6px 14px 6px 9px;
  }
  .brand-pill .logo-img{width:30px;height:30px;display:block;object-fit:contain}
  .brand-pill .wm{font-size:17px;font-weight:700;letter-spacing:.2px;color:var(--ink)}

  /* ---- section title ---- */
  .sec-title{display:flex;align-items:center;gap:9px;font-family:'Lora',serif;
    font-size:21px;font-weight:600;color:var(--primary);letter-spacing:.2px}

  /* ---- gradient buttons ---- */
  .grad-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    background:linear-gradient(90deg,var(--cta-a),var(--cta-b));color:#fff;border:none;
    border-radius:18px;padding:16px;font-family:inherit;font-size:16.5px;font-weight:700;letter-spacing:.3px;
    cursor:pointer;box-shadow:0 10px 26px rgba(238,108,58,.40);transition:transform .12s ease}
  .grad-btn:active{transform:scale(.985)}
  .grad-btn:disabled{background:#EADFD3;color:#B3A392;box-shadow:none;cursor:default}

  /* ---- B. reward ledger ---- */
  .ledger{display:flex;align-items:center;gap:13px;padding:20px 18px}
  .ledger .coin{width:32px;height:32px;flex:none;align-self:center;
    filter:drop-shadow(0 3px 6px rgba(214,150,20,.35))}
  .ledger-info{flex:1;min-width:0}
  .ledger-title{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.3px}
  .ledger-amount{font-size:23px;font-weight:800;line-height:1.3}
  .ledger-amount .unit{font-size:13px;font-weight:600;color:var(--ink-2)}
  .btn-claim{font-family:inherit;font-size:13px;font-weight:700;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(90deg,var(--cta-a),var(--cta-b));border-radius:999px;padding:10px 18px;min-height:38px;
    align-self:center;white-space:nowrap;
    box-shadow:0 6px 16px rgba(238,108,58,.35);transition:transform .12s ease}
  .btn-claim:active{transform:scale(.96)}
  .btn-claim:disabled{background:#EFE4D8;color:#B3A392;box-shadow:none;cursor:default}

  /* ---- C. the roll ---- */
  .cast{display:flex;flex-direction:column;align-items:center;gap:15px;padding:26px 20px 22px}
  .stage{position:relative;width:180px;height:180px;display:flex;align-items:center;justify-content:center}
  .halo{position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle,rgba(245,183,29,.38) 0%,rgba(245,183,29,.12) 45%,transparent 70%);
    animation:breathe 4.5s ease-in-out infinite}
  .ring{position:absolute;inset:-8px;animation:spin 60s linear infinite;opacity:.9}
  .ring svg{width:100%;height:100%;display:block}
  /* 3D dice — three nested layers, each animating ONE thing:
     .scene = static camera (perspective) · .mover = travel + hops (rAF)
     · .cube = the end-over-end tumble (one long CSS transition).
     A sibling .d3-shadow tracks the mover on the floor. */
  .scene{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);
    perspective:760px;perspective-origin:50% 30%}
  .mover{will-change:transform}
  .cube{width:92px;height:92px;position:relative;transform-style:preserve-3d;will-change:transform;
    transform:rotateX(-16deg) rotateY(24deg)}  /* resting tilt: 3 faces visible */
  .cube.idle{animation:bob3 3.8s ease-in-out infinite}
  @keyframes bob3{
    0%,100%{transform:rotateX(-16deg) rotateY(24deg) translateY(0)}
    50%{transform:rotateX(-12deg) rotateY(30deg) translateY(-7px)}}
  /* backfaces stay VISIBLE so the cube reads as a solid object — hiding
     them opens see-through holes mid-tumble (mirrored insides are always
     occluded by the opaque near faces) */
  /* faces: near-square corners + one flat colour = a closed, solid die
     (large radii opened visible notches at the cube's corners) */
  .cf{position:absolute;width:92px;height:92px;border-radius:4px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:#FAE9C7;
    border:1px solid #EBC27A;
    box-shadow:inset 0 1px 0 #FFF6E3, inset 0 -6px 12px rgba(200,140,40,.16)}
  .cf b{font-family:'Lora',serif;font-size:34px;font-weight:700;line-height:1;
    background:linear-gradient(160deg,var(--primary-2) 0%,var(--primary-deep) 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .cf em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;color:#A87A15;text-transform:uppercase}
  .cf.big b{font-size:27px}          /* 3-digit prize (100) */
  .cf.luck b{font-size:15.5px;line-height:1.15;text-align:center;  /* better-luck faces */
    background:linear-gradient(160deg,#C9AE8E 0%,#A08064 90%);-webkit-background-clip:text;background-clip:text}
  .cf.luck em{color:#A79076}
  /* faces: half the cube size = translateZ(46px) for a 92px cube */
  .cf1{transform:translateZ(46px)}
  .cf2{transform:rotateY(90deg) translateZ(46px)}
  .cf3{transform:rotateY(180deg) translateZ(46px)}
  .cf4{transform:rotateY(-90deg) translateZ(46px)}
  .cf5{transform:rotateX(90deg) translateZ(46px)}
  .cf6{transform:rotateX(-90deg) translateZ(46px)}
  .d3-shadow{position:absolute;bottom:28px;left:50%;width:96px;height:12px;border-radius:50%;
    background:rgba(140,105,50,.24);filter:blur(5px);transform:translateX(-50%);
    will-change:transform,opacity}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes breathe{0%,100%{opacity:.65;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
  .stage.rolling .halo{animation-duration:1.2s}

  /* ---- D. progress / reset timer ---- */
  .progress{display:flex;align-items:center;gap:10px}
  .p-dots{display:flex;gap:7px}
  .p-dot{width:12px;height:12px;background:#EAD9C6;
    clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%)}
  .p-dot.used{background:linear-gradient(135deg,var(--primary-2),var(--primary-deep))}
  .p-text{font-size:13px;font-weight:600;color:#8C7263}
  .timer{display:none;align-items:center;gap:8px;background:var(--surface);
    border:1px solid var(--cream-2);border-radius:999px;padding:9px 18px;box-shadow:var(--shadow-sm)}
  .timer svg{width:16px;height:16px;color:var(--primary);flex:none}
  .timer span{font-size:12.5px;font-weight:600;color:#8C7263}
  .timer b{font-size:14px;font-weight:700;color:var(--primary-deep);font-variant-numeric:tabular-nums}
  .cast-done{text-align:center;display:none}
  .cast-done .dt{font-family:'Lora',serif;font-size:19px;font-weight:600;color:var(--ink)}
  .cast-done .db{font-size:13px;color:var(--ink-2);margin-top:4px;line-height:1.5}

  /* ---- overlays (result + redeem share the same chrome) ---- */
  .overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    padding:24px 20px;background:rgba(252,238,225,.9);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
  .overlay.visible{display:flex}
  .ov-card{position:relative;width:100%;max-width:400px;max-height:86vh;overflow-y:auto;
    padding:28px 22px 24px;text-align:center}

  /* ---- win celebration: a few small coins drift down, understated ---- */
  .coin-burst{position:absolute;inset:0;pointer-events:none;z-index:5}
  .coin-burst span{position:absolute;top:-16px;width:13px;height:13px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#FCE29A,#EFB42B 70%);
    box-shadow:0 1px 2px rgba(180,120,20,.35);opacity:0;
    animation:coinFall 1.5s ease-in forwards}
  @keyframes coinFall{
    0%{opacity:0;transform:translateY(0) rotate(0deg)}
    10%{opacity:.9}
    100%{opacity:0;transform:translateY(300px) rotate(240deg)}
  }
  .ov-title{font-family:'Lora',serif;font-size:24px;font-weight:700;margin-top:4px}
  .ov-amount{display:none;align-items:center;justify-content:center;gap:10px;margin-top:10px}
  .ov-amount.visible{display:flex;animation:amt .55s cubic-bezier(.22,1.4,.36,1) both}
  @keyframes amt{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:scale(1)}}
  .ov-amount .coin{width:40px;height:40px;filter:drop-shadow(0 4px 8px rgba(214,150,20,.4))}
  .ov-amount .amt{font-size:48px;font-weight:800;line-height:1;
    background:linear-gradient(90deg,#D8940B,#F5B71D);-webkit-background-clip:text;background-clip:text;color:transparent}
  .ov-amount .unit{font-size:15px;font-weight:700;color:var(--ink-2);align-self:flex-end;padding-bottom:6px}
  .ov-note{font-size:12.5px;color:var(--ink-2);margin-top:10px;line-height:1.5}

  /* ---- final-roll result screen: the spin result is REPLACED by the wallet
     total (not appended below it) — a crossfade + lift swap between the two
     blocks inside the same card. ---- */
  .ov-swap{transition:opacity .3s ease, transform .3s ease}
  .ov-swap.hide{opacity:0;transform:translateY(-8px);pointer-events:none}
  .ov-wallet-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
  .ov-astro-note{font-size:13px;font-weight:600;color:var(--primary-deep);margin-top:14px}
  .btn-gold{font-family:inherit;font-size:16px;font-weight:700;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(90deg,var(--cta-a),var(--cta-b));border-radius:18px;padding:14px;width:100%;
    margin-top:16px;box-shadow:0 8px 20px rgba(244,87,34,.34);transition:transform .12s ease}
  .btn-gold:active{transform:scale(.985)}
  .ov-card .grad-btn{margin-top:18px;padding:14px}
  .ov-card .grad-btn.ghost{background:#FFFFFF;color:var(--primary);box-shadow:var(--shadow-sm);border:1.5px solid var(--cream-2)}

  /* ---- redeem modal: crediting animation -> success ---- */
  .redeem-spinner{display:none;width:56px;height:56px;margin:6px auto 4px;position:relative}
  .redeem-spinner.visible{display:block}
  .redeem-spinner svg{width:100%;height:100%;animation:spin 1s linear infinite}
  .redeem-spinner circle{fill:none;stroke:var(--cream-2);stroke-width:5}
  .redeem-spinner circle.arc{stroke:var(--primary);stroke-linecap:round;stroke-dasharray:80 200}

  /* ---- blocked / error ---- */
  .state-card{display:none;text-align:center;padding:40px 26px}
  .state-card .st{font-family:'Lora',serif;font-size:21px;font-weight:600}
  .state-card .sb{font-size:13.5px;color:var(--ink-2);margin-top:9px;line-height:1.55}
  .btn-retry{font-family:inherit;font-size:14px;font-weight:700;color:var(--primary);cursor:pointer;
    background:var(--surface);border:1.5px solid var(--primary);border-radius:999px;padding:10px 26px;margin-top:16px}
  #surface{display:none;flex-direction:column;gap:18px}
  body.state-blocked #blocked{display:block}
  body.state-error #softError{display:block}
  body.state-ready #surface{display:flex}

  /* ---- footer back-to-home: only shown once today's 3 rolls are used up ---- */
  .btn-home{display:none;font-family:inherit;font-size:14px;font-weight:700;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(90deg,var(--cta-a),var(--cta-b));border-radius:999px;padding:12px 26px;
    margin:4px auto 0;box-shadow:0 6px 16px rgba(238,108,58,.35);transition:transform .12s ease}
  .btn-home.visible{display:block}
  .btn-home:active{transform:scale(.97)}

  button:focus-visible,a:focus-visible{outline:3px solid rgba(241,102,43,.45);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){
    .cube.idle,.halo,.ring,.pop,.ov-amount.visible,.redeem-spinner svg{animation:none !important}
    .cube{transition:none !important}
    .ov-swap{transition:none !important}
  }
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .pop{animation:pop .5s ease both}
</style>
</head>

        <button class="btn-claim" id="claimBtn" type="button" disabled></button>

      <!-- C. the roll -->
      <section class="bx cast">
        <div class="sec-title" id="castHeading"></div>
        <div class="stage" id="stage">
          <div class="halo"></div>
          <div class="ring" aria-hidden="true">

            </svg>

            <div class="mover" id="mover">
              <div class="cube idle" id="cube">
                <div class="cf cf1 big"><b>100</b><em>coins</em></div>
                <div class="cf cf2"><b>20</b><em>coins</em></div>
                <div class="cf cf3"><b>30</b><em>coins</em></div>
                <div class="cf cf4 luck"><b>Better luck<br>next time</b></div>
                <div class="cf cf5"><b>10</b><em>coins</em></div>
                <div class="cf cf6 luck"><b>Better luck<br>next time</b></div>
              </div>
            </div>
          </div>
        </div>
        <!-- D. progress / reset timer -->
        <div class="progress" id="progressRow">
          <div class="p-dots" id="progressDots"></div>
          <span class="p-text" id="progressText"></span>
        </div>
        <div class="timer" id="timer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>
          </svg>
          <span id="timerLabel"></span><b id="timerValue"></b>

        <button class="grad-btn" id="rollBtn" type="button"></button>
        <div class="cast-done" id="castDone">

          <div class="db" id="doneBody"></div>
        </div>
      </section>
    </div>

    <button class="btn-home" id="homeBtn" type="button">Back to Home</button>
  </main>
</div>

<!-- post-roll result screen: on the final roll of the day, the spin result
     (ovResult) is replaced by the wallet total (ovWallet) via a crossfade,
     not appended below it. -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true">

<!-- redeem flow: crediting animation -> redeemed amount -->
<div class="overlay" id="redeemModal" role="dialog" aria-modal="true">
  <div class="bx ov-card pop">
    <div class="redeem-spinner" id="redeemSpinner">
      <svg viewBox="0 0 56 56">
        <circle cx="28" cy="28" r="24"/>

        <path d="M18 9c.8 3.6 2.2 5.4 5 7.5-2.8 2.1-4.2 3.9-5 7.5-.8-3.6-2.2-5.4-5-7.5 2.8-2.1 4.2-3.9 5-7.5z" fill="#B97E10"/>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const userId = params.get('user_id');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DAY_TZ = 'Asia/Kolkata'; // must match the server's product-day boundary

  let session = null;
  let busy = false;
  let timerHandle = null;
  let overlayTryAgain = false;

  function setBodyState(state) { document.body.className = 'state-' + state; }

  async function api(path, opts) {
    const res = await fetch(path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error(data.error || 'HTTP ' + res.status); e.data = data; e.status = res.status; throw e; }
    return data;
  }

  function template(str, vars) {
    return String(str || '').replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
  }

  // ------- analytics: fire-and-forget, must never break the product -------
  // Server stamps the super properties (user_id echoed + product day, IST).
  // `source` says from where the tap came (cast_card, result_overlay,
  // ledger, sticky_bar, page_load). sendBeacon survives the deeplink
  // navigation on the consult CTA.
  function track(event, source, props) {
    if (!userId) return;
    try {
      const body = JSON.stringify({ user_id: userId, event, source, props: props || {} });
      if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/track', new Blob([body], { type: 'application/json' }));
      } else {
        fetch('/api/track', { method: 'POST', headers: { 'content-type': 'application/json' }, body, keepalive: true }).catch(() => {});
      }
    } catch (e) { /* analytics never throws */ }
  }

  // ------- back navigation: RN bridge first (pops this screen), deeplink
  // fallback for app builds without the bridge, history for plain browsers.
  function goBack() {
    if (window.ReactNativeWebView) {
      window.ReactNativeWebView.postMessage(JSON.stringify({ action: 'GO_BACK' }));
      return;
    }
    const deeplink = (session && session.nav && session.nav.backDeeplink) || 'astrolokal://BottomTabs?screen=Home';
    if (deeplink) location.href = deeplink;
    else history.back();
  }

  // ------- 3D dice roll: faces are PRIZES; the landing face IS the actual
  // reward the server granted. Orientation = [rotX, rotY] that brings that
  // face front-on. -------
  const CUBE_FACES = [
    { sel: '.cf1', value: 100, orient: [0, 0]    }, // front (100 faces out at rest)
    { sel: '.cf2', value: 20,  orient: [0, -90]  }, // right
    { sel: '.cf3', value: 30,  orient: [0, 180]  }, // back
    { sel: '.cf4', value: 0,   orient: [0, 90]   }, // left  (better luck)
    { sel: '.cf5', value: 10,  orient: [-90, 0]  }, // top
    { sel: '.cf6', value: 0,   orient: [90, 0]   }, // bottom (better luck)
  ];
  function landingFace(reward) {
    // restore the front face's default label (a rare odd amount may have
    // been printed on it by a previous roll)
    const front = $('cube').querySelector('.cf1');
    front.firstElementChild.textContent = '100';
    front.classList.add('big');
    if (!(Number(reward) > 0)) {
      return CUBE_FACES[Math.random() < 0.5 ? 3 : 5];
    }
    const exact = CUBE_FACES.find((f) => f.value === Number(reward));
    if (exact) return exact;
    // uncommon amount (lifetime-budget clamp): print it on the front face
    front.firstElementChild.textContent = String(reward);
    front.classList.toggle('big', String(reward).length > 2);
    return CUBE_FACES[0];
  }
  // Travel + hops on the mover (rAF); the shadow tracks x and sells height.
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
  function startTravel(T) {
    const mover = $('mover'), shadow = $('dShadow');
    const X0 = -40, X1 = 14, X2 = 0; // enter from left, overshoot, settle center
    const xAt = (p) => (p < 0.6
      ? X0 + (X1 - X0) * easeOut(p / 0.6)
      : X1 + (X2 - X1) * easeOut((p - 0.6) / 0.4));
    let t0 = null;
    function frame(ts) {
      if (!t0) t0 = ts;
      const p = Math.min((ts - t0) / T, 1);
      const x = xAt(p);
      const hop = Math.abs(Math.sin(p * Math.PI * 3)) * 30 * (1 - p); // 3 decaying hops
      mover.style.transform = 'translateX(' + x + 'px) translateY(' + -hop + 'px)';
      shadow.style.transform = 'translateX(calc(-50% + ' + x + 'px)) scale(' + (1 - hop / 70) + ')';
      shadow.style.opacity = String(1 - hop / 60);
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  // The tumble: ONE long decelerating transition to the landing orientation
  // plus whole extra turns (X-dominant = end-over-end somersault), then a
  // springy settle back to the resting tilt keeping the same whole turns.
  function run3D(face, done) {
    const cube = $('cube');
    cube.classList.remove('idle');
    const o = face.orient;
    const turnsY = Math.random() < 0.5 ? 720 : 1080; // whole-turn jitter only
    cube.style.transition = 'none';
    cube.style.transform = 'rotateX(-16deg) rotateY(24deg)';
    void cube.offsetWidth; // force reflow — mandatory before the transition
    cube.style.transition = 'transform 1.55s cubic-bezier(.18,.74,.26,1)';
    // arrive with the prize face dead front-on (whole turns keep the spin)
    cube.style.transform = 'rotateX(' + (o[0] - 1080) + 'deg) rotateY(' + (o[1] + turnsY) + 'deg)';
    startTravel(1550);
    // landing beat: a soft press-pop on the SAME transform channel (rotation
    // unchanged, only scale) — transitions can't fight each other, so the
    // landing never snaps or judders. The cube stays dead front-on.
    const rot = 'rotateX(' + (o[0] - 1080) + 'deg) rotateY(' + (o[1] + turnsY) + 'deg)';
    setTimeout(() => {
      cube.style.transition = 'transform .16s ease-out';
      cube.style.transform = rot + ' scale(1.07)';
      setTimeout(() => {
        cube.style.transition = 'transform .26s cubic-bezier(.34,1.56,.64,1)';
        cube.style.transform = rot + ' scale(1)';
        setTimeout(done, 280);
      }, 170);
    }, 1600);
  }

  // ------- countdown to the next daily reset (IST midnight) -------
  function timeToReset() {
    const now = new Date(new Date().toLocaleString('en-US', { timeZone: DAY_TZ }));
    const mid = new Date(now);
    mid.setHours(24, 0, 0, 0);
    const ms = mid - now;
    const h = Math.floor(ms / 3_600_000);
    const m = Math.floor((ms % 3_600_000) / 60_000);
    return h + 'h ' + String(m).padStart(2, '0') + 'm';
  }
  function startTimer(tpl) {
    stopTimer();
    $('timerLabel').textContent = String(tpl || '{time}').split('{time}')[0].trim();
    const tick = () => { $('timerValue').textContent = timeToReset(); };
    tick();
    timerHandle = setInterval(tick, 30_000);
  }
  function stopTimer() {
    if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
  }

  // ------- render (everything driven by the server session payload) -------
  function renderChrome(copy) {
    $('castHeading').textContent = copy.cast.heading || '';
    $('ledgerTitle').textContent = copy.ledger.title || '';
    $('ledgerUnit').textContent = copy.ledger.unit || '';
    $('doneTitle').textContent = copy.cast.doneTitle || '';
    $('doneBody').textContent = copy.cast.doneBody || '';
  }

  function render() {
    const s = session;
    const copy = s.copy;
    renderChrome(copy);

    // B. total won — persists across days until redeemed
    $('ledgerAmount').textContent = s.walletBalance;
    const claimBtn = $('claimBtn');
    claimBtn.textContent = copy.ledger.claimCta || '';
    claimBtn.disabled = !s.claimable || busy;

    // C + D. roll button, progress or reset timer
    const rollBtn = $('rollBtn');
    rollBtn.textContent = busy ? (copy.cast.rollingLabel || '') : (copy.cast.rollCta || '');
    rollBtn.disabled = busy || s.complete;
    rollBtn.style.display = s.complete ? 'none' : '';
    $('castDone').style.display = s.complete ? 'block' : 'none';
    $('progressRow').style.display = s.complete ? 'none' : '';
    $('timer').style.display = s.complete ? 'flex' : 'none';
    if (s.complete) {
      startTimer(copy.progress.nextRollTemplate);
    } else {
      stopTimer();
      const dots = $('progressDots');
      dots.innerHTML = '';
      for (let i = 0; i < s.castsPerDay; i++) {
        const d = document.createElement('span');
        d.className = 'p-dot' + (i < s.castsUsed ? ' used' : '');
        dots.appendChild(d);
      }
      $('progressText').textContent = template(copy.progress.leftTemplate, { n: s.castsLeft, total: s.castsPerDay });
    }

    // Back to Home — only once today's 3 rolls are used up.
    $('homeBtn').classList.toggle('visible', s.complete);

    setBodyState('ready');
  }

  // ------- errors -------
  function showBlocked(copy) {
    $('blockedTitle').textContent = (copy && copy.title) || 'Login required';
    $('blockedBody').textContent = (copy && copy.body) || 'Please login from the AstroLokal app to access this page.';
    setBodyState('blocked');
  }
  function showError(copy) {
    $('errorTitle').textContent = (copy && copy.title) || 'Something went wrong';
    $('errorBody').textContent = (copy && copy.body) || 'Please try again in a moment.';
    $('retryBtn').textContent = (copy && copy.retry) || 'Retry';
    setBodyState('error');
  }

  // ------- win celebration: a handful of small coins drift down inside the
  // result card. Understated on purpose — a beat of delight, not confetti. -------
  function spawnCoinBurst() {
    if (reducedMotion) return;
    const el = $('coinBurst');
    el.innerHTML = '';
    const count = 7;
    for (let i = 0; i < count; i++) {
      const c = document.createElement('span');
      c.style.left = (8 + Math.random() * 84) + '%';
      c.style.animationDelay = (Math.random() * 0.35) + 's';
      c.style.animationDuration = (1.2 + Math.random() * 0.5) + 's';
      el.appendChild(c);
    }
    setTimeout(() => { el.innerHTML = ''; }, 2200);
  }

  // ------- result screen -------
  // Every non-final roll closes with "Roll again" and rolls immediately.
  // On the final roll of the day, once the win/no-win beat has landed, the
  // spin result is REPLACED (crossfade, not appended below) by the wallet
  // total with a Redeem Now CTA — unless the balance is 0, in which case
  // the user just continues.
  function showResult(result) {
    const copy = session.copy;
    const rc = copy.result || {};
    const win = result.reward > 0;
    const s = result.session;
    overlayTryAgain = !s.complete;

    const ovResult = $('ovResult');
    const ovWallet = $('ovWallet');
    ovResult.classList.remove('hide');
    ovResult.style.display = '';
    ovWallet.classList.add('hide');
    ovWallet.style.display = 'none';

    $('ovTitle').textContent = win ? (rc.winTitle || '') : (rc.noWinTitle || '');
    $('ovAmount').classList.toggle('visible', win);
    $('ovAmt').textContent = String(result.reward);
    $('ovUnit').textContent = copy.ledger.unit || '';
    $('ovNote').textContent = win ? '' : (rc.noWinNote || '');

    const showWallet = s.complete && s.walletBalance > 0;
    const ovClose = $('ovClose');
    // Once the wallet total is showing, Redeem Now is the only way forward —
    // no Continue/dismiss button (backdrop tap still closes it).
    ovClose.style.display = showWallet ? 'none' : '';
    ovClose.textContent = overlayTryAgain ? (rc.rollAgainCta || rc.continueCta || '') : (rc.continueCta || '');

    if (win) spawnCoinBurst();

    if (showWallet) {
      setTimeout(() => {
        ovResult.classList.add('hide'); // fade + lift the result out
        setTimeout(() => {
          ovResult.style.display = 'none';
          $('ovWalletLabel').textContent = rc.walletTitle || '';
          $('ovWalletAmt').textContent = String(s.walletBalance);
          $('ovWalletUnit').textContent = copy.ledger.unit || '';
          $('ovRedeem').textContent = rc.redeemNowCta || '';
          $('ovAstroNote').textContent = rc.talkAstrologerNote || '';
          ovWallet.style.display = 'block';
          void ovWallet.offsetWidth; // force reflow so the next class change transitions
          ovWallet.classList.remove('hide'); // fade + drop the wallet total in
        }, reducedMotion ? 0 : 300);
      }, reducedMotion ? 0 : 1500);
    }

    const overlay = $('overlay');
    overlay.classList.add('visible');
    document.body.style.overflow = 'hidden';
    if (!showWallet) ovClose.focus({ preventScroll: true });
  }
  function closeResult(viaButton) {
    const overlay = $('overlay');
    overlay.classList.remove('visible');
    document.body.style.overflow = '';
    if (viaButton && overlayTryAgain) {
      overlayTryAgain = false;
      if (session && !session.complete) track('tap_dice_roll_continue', 'result_overlay', { roll_number: session.castsUsed + 1 });
      doRoll(); // "Roll again" lands home and goes straight into the next roll
      return;
    }
    if (viaButton && session && session.complete) track('tap_final_continue', 'result_overlay', {});
    overlayTryAgain = false;
  }

  // ------- redeem modal: shared crediting -> success flow, used from both
  // the ledger's Redeem Coins button and the result overlay's Redeem Now. -------
  async function runRedeem(source) {
    if (busy || !session || !session.claimable) return;
    track('tap_redeem_coins', source, { amount: session.walletBalance });
    busy = true;
    const copy = session.copy.redeemModal || {};
    const modal = $('redeemModal');
    $('redeemSpinner').classList.add('visible');
    $('redeemTitle').textContent = copy.creditingTitle || '';
    $('redeemAmount').classList.remove('visible');
    $('redeemNote').textContent = '';
    $('redeemClose').style.display = 'none';
    $('overlay').classList.remove('visible');
    modal.classList.add('visible');
    document.body.style.overflow = 'hidden';

    const started = Date.now();
    try {
      const result = await api('/api/claim', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ user_id: userId }),
      });
      // Keep the crediting beat on screen for a minimum, perceptible stretch
      // even when the server answers instantly — the "crediting" state
      // should always feel like something happened.
      const elapsed = Date.now() - started;
      if (!reducedMotion && elapsed < 900) await new Promise((r) => setTimeout(r, 900 - elapsed));

      session = result.session;
      $('redeemSpinner').classList.remove('visible');
      $('redeemTitle').textContent = copy.doneTitle || '';
      $('redeemAmt').textContent = String(result.claimedAmount);
      $('redeemUnit').textContent = session.copy.ledger.unit || '';
      $('redeemAmount').classList.add('visible');
      $('redeemNote').textContent = copy.doneNote || '';
      $('redeemClose').textContent = copy.closeCta || '';
      $('redeemClose').style.display = '';
      render();
    } catch (err) {
      modal.classList.remove('visible');
      document.body.style.overflow = '';
      if (err.status === 409) await load();
      else showError(err.data && err.data.copy);
    }
    busy = false;
  }
  function closeRedeemModal() {
    $('redeemModal').classList.remove('visible');
    document.body.style.overflow = '';
  }

  // ------- actions -------
  async function doRoll() {
    if (busy || !session || session.complete) return;
    busy = true;
    render();
    const stage = $('stage');
    stage.classList.add('rolling');
    try {
      const result = await api('/api/cast', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ user_id: userId }),
      });
      const face = landingFace(result.reward);
      if (reducedMotion) {
        // no animation: place the prize face dead front-on
        const cube = $('cube');
        cube.classList.remove('idle');
        cube.style.transition = 'none';
        cube.style.transform =
          'rotateX(' + face.orient[0] + 'deg) rotateY(' + face.orient[1] + 'deg)';
      } else {
        await new Promise((resolve) => run3D(face, resolve));
      }
      stage.classList.remove('rolling');
      session = result.session;
      busy = false;
      render();
      showResult(result);
    } catch (err) {
      stage.classList.remove('rolling');
      busy = false;
      if (err.status === 409) { await load(); return; } // out of sync — refresh truth
      showError(err.data && err.data.copy);
    }
  }

  // ------- boot -------
  async function load() {
    // No user_id in the query params -> this webview wasn't opened from the
    // app; nothing to fetch, just ask them to login via AstroLokal.
    if (!userId) { showBlocked(null); return; }
    try {
      session = await api('/api/session?user_id=' + encodeURIComponent(userId || ''));
      render();
      if (!load.viewTracked) {
        load.viewTracked = true; // once per page open, not per retry/refresh
        track('viewed_daily_dice', 'page_load', { rolls_used: session.castsUsed, wallet_balance: session.walletBalance });
      }
    } catch (err) {
      if (err.status === 401 || err.status === 400) showBlocked(err.data && err.data.copy);
      else showError(err.data && err.data.copy);
    }
  }

  $('backBtn').addEventListener('click', () => {
    track('tap_back', 'header', { rolls_used: session ? session.castsUsed : null });
    goBack();
  });
  $('homeBtn').addEventListener('click', () => {
    // Same goBack() bridge/deeplink as the header back arrow — only the
    // event name + source differ, so the two taps are distinguishable in
    // analytics without diverging in behavior.
    track('tap_back_home', 'footer', { rolls_used: session ? session.castsUsed : null });
    goBack();
  });
  $('rollBtn').addEventListener('click', () => {
    if (!busy && session && !session.complete) track('tap_dice_roll', 'cast_card', { roll_number: session.castsUsed + 1 });
    doRoll();
  });
  $('claimBtn').addEventListener('click', () => runRedeem('ledger'));
  $('retryBtn').addEventListener('click', load);
  $('ovRedeem').addEventListener('click', () => runRedeem('result_overlay'));
  $('ovClose').addEventListener('click', () => closeResult(true));
  $('overlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeResult(false); });
  $('redeemClose').addEventListener('click', closeRedeemModal);
  $('redeemModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeRedeemModal(); });

  load();
})();
</script>
</body>
</html>

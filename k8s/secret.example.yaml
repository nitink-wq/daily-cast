# Template only — create the real secret out-of-band, never commit it:
#   kubectl create secret generic daily-cast-secrets \
#     --from-literal=DATABASE_URL='postgres://...' \
#     --from-literal=COIN_API_URL='https://dev-api.astrolokal.com/v1/system-transactions/' \
#     --from-literal=COIN_API_USER='...' \
#     --from-literal=COIN_API_PASS='...'
apiVersion: v1
kind: Secret
metadata:
  name: daily-cast-secrets
type: Opaque
stringData:
  DATABASE_URL: postgres://user:password@postgres-host:5432/dailycast
  COIN_API_URL: ""   # empty -> sealed stub ledger; set to enable the real Coin API
  COIN_API_USER: ""  # HTTP Basic auth credentials for the system-transactions API
  COIN_API_PASS: ""
